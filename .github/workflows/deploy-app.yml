name: Deploy App to CF Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - qa
          - prod
      election_id:
        description: 'Election to build and deploy (VITE_ELECTION_ID)'
        required: true
        type: choice
        default: 'peru_2026'
        options:
          - peru_2026
          - peru_regional_2026
      app_branch:
        description: 'Branch of electometro-org/app to deploy (empty = default branch)'
        required: false
        type: string
        default: ''
      cf_workers_branch:
        description: 'Branch of electometro-org/cf-workers to deploy (empty = default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ${{ inputs.election_id }} to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout peru (this repo)
        uses: actions/checkout@v4

      - name: Clone electometro-app
        uses: actions/checkout@v4
        with:
          repository: electometro-org/app
          ref: ${{ inputs.app_branch }}
          path: electometro
          token: '${{ secrets.GH_ORG_TOKEN }}'

      - name: Clone cf-workers
        uses: actions/checkout@v4
        with:
          repository: electometro-org/cf-workers
          ref: ${{ inputs.cf_workers_branch }}
          path: cf-workers
          token: '${{ secrets.GH_ORG_TOKEN }}'

      - name: Setup app directories
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          cd electometro

          # Remove existing symlinks
          rm -f public wrangler i18n

          # Copy public assets from peru repo
          cp -r ../app/public ./public
          
          # Copy i18n assets from peru repo
          cp -r ../app/i18n ./i18n

          # Copy wrangler config from cf-workers
          cp -r ../cf-workers/peru_2026/wrangler ./wrangler
          echo $APP_ENV_FILE | base64 --decode > .env

          # Non-secret per-environment settings (app/env/qa.env, app/env/prod.env): appended last,
          # so they override the same keys from the secret. The blank line guards against a secret
          # whose last line has no trailing newline.
          printf '\n' >> .env
          cat ../app/env/${{ inputs.environment }}.env >> .env

      - name: Replace QA placeholder in _headers
        if: inputs.environment == 'qa'
        env:
          QA_DOMAIN: ${{ secrets.QA_DOMAIN }}
        run: |
          sed -i "s/placeholder\.com/$QA_DOMAIN/g" electometro/public/static/_headers

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electometro/package-lock.json

      - name: Install dependencies
        working-directory: electometro
        run: npm ci

      - name: Build and Deploy to Cloudflare Workers
        working-directory: electometro
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FINGERPRINT_KEY: ${{ secrets.FINGERPRINT_KEY }}
          VITE_ELECTION_ID: ${{ inputs.election_id }}
        run: |
          npx fpscanner build
          if [ "${{ inputs.environment }}" = "qa" ]; then
            npm run deploy-qa > /dev/null 2>&1
          else
            npm run deploy
          fi
      - name: Collect Wrangler logs
        if: always()
        run: |
          mkdir -p deploy-logs

          if [ -d "/home/runner/.config/.wrangler/logs" ]; then
            cp -r /home/runner/.config/.wrangler/logs/* deploy-logs/ || true
          fi

          echo "Collected logs:"
          ls -lah deploy-logs || true
      - name: Push private deploy logs
        if: always()
        env:
          TOKEN: ${{ secrets.GH_ORG_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/electometro-org/deploy-logs-peru.git private-logs

          mkdir -p private-logs/${{ inputs.environment }}/${{ github.run_id }}

          cp deploy-logs/*.log private-logs/${{ inputs.environment }}/${{ github.run_id }}/

          cd private-logs
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Deploy logs: ${{ inputs.environment }} run ${{ github.run_id }}" || exit 0
          git push